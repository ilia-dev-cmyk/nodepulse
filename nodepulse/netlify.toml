# Netlify build configuration for a Git-connected site.
# With this file present, the build command and publish directory are read from the
# repository, so the Netlify UI settings do not need to be filled in by hand.
#
# SPA fallback (_redirects), security headers (_headers), robots.txt and sitemap.xml
# all live in `public/` and are copied into `dist/` by Vite.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
